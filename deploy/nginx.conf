# /etc/nginx/sites-available/maderavida
# Nginx como proxy inverso + servidor de archivos estaticos y media.
#
# Instalacion:
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/maderavida
#   sudo ln -s /etc/nginx/sites-available/maderavida /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# HTTPS: usar certbot para generar el certificado (ver README de despliegue):
#   sudo certbot --nginx -d maderavida.cl -d www.maderavida.cl

upstream maderavida_app {
    server unix:/run/maderavida/gunicorn.sock fail_timeout=0;
}

server {
    listen 80;
    server_name maderavida.cl www.maderavida.cl;

    # Certbot reescribe este bloque al instalar el certificado.
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name maderavida.cl www.maderavida.cl;

    # Rutas que completa certbot:
    # ssl_certificate     /etc/letsencrypt/live/maderavida.cl/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/maderavida.cl/privkey.pem;

    client_max_body_size 6M;  # coherente con DATA_UPLOAD_MAX_MEMORY_SIZE (5MB)

    access_log /var/log/nginx/maderavida.access.log;
    error_log  /var/log/nginx/maderavida.error.log;

    location /static/ {
        alias /srv/maderavida/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /media/ {
        alias /srv/maderavida/media/;
        expires 7d;
    }

    location / {
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Sin este header, SECURE_SSL_REDIRECT de Django entra en bucle:
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_pass http://maderavida_app;
    }
}
